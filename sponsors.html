<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        michroma: ['Michroma', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        nero: '#1a1a1a',
                        charcoal: '#222222',
                        arancio: '#E31E24',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>

    <!-- Navigation -->
    <header id="navbar" class="fixed top-0 w-full z-50 transition-all duration-300 bg-nero border-b border-white/10">

            <div class="flex items-center">
                <a href="index.html" class="flex items-center text-xl md:text-2xl font-michroma font-bold text-white transition-colors group [-webkit-text-stroke:1px_white]">

                <a href="https://bvcoenm.edu.in/" target="_blank" rel="noopener noreferrer" class="flex items-center">

                <a href="events.html" class="nav-link text-sm font-semibold tracking-widest hover:text-arancio transition-colors uppercase">Events</a>
                <a href="sponsors.html" class="nav-link text-sm font-semibold tracking-widest transition-colors uppercase text-arancio border border-arancio shadow-[0_0_10px_rgba(227,30,36,0.6)] px-4 py-2 rounded-md">Sponsors</a>

            </nav>

            <button class="md:hidden text-white hover:text-arancio" aria-label="Toggle Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>

            <div class="w-full h-full flex flex-col items-center justify-center relative z-10">
                <h2 class="text-4xl md:text-5xl font-michroma font-normal text-white mb-12 tracking-wide text-center uppercase">
                    Our Sponsors
                </h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 md:gap-8 w-full max-w-7xl mx-auto px-6" id="sponsors-grid">

        <div class="max-w-7xl mx-auto px-6">
            <div class="border-t border-white/10 pt-8 flex flex-col md:flex-row justify-between items-center gap-4">
                <p class="text-gray-500 text-sm font-space tracking-wide">
                    &copy; 2026 YANTRAM - MESA. All Rights Reserved.
